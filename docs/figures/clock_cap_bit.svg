<text fill="#222222"  xml:space="preserve" font-size="32.8363" transform="translate(144.711, 266.615)" >Switched timing capacitor | one configuration bit</text>
<text fill="#222222"  xml:space="preserve" font-size="15.734" transform="translate(144.711, 323.442)" >SEL=1 connects A to a grounded capacitor. SEL=0 isolates it and parks its top plate at VSS.</text>
<text fill="#222222"  xml:space="preserve" font-size="15.734" transform="translate(171.022, 1961.31)" >WEIGHT is a physical capacitor ratio. The configuration input remains static during acquisition.</text>
