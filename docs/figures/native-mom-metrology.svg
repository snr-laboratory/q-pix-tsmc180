<text fill="#222222"  xml:space="preserve" font-size="12.48" transform="translate(264, 486.832)" >PWL(0 0 1n 0 2n 0.9 4n 0.9 5n 0 6n 0)</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(1008, 193.032)" >XCAP</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(1068, 133.032)" >M1-M3 MOM | 8 x 8</text>
