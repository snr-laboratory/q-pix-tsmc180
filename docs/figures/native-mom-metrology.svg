<text fill="#222222"  xml:space="preserve" font-size="28.08" transform="translate(120, 85.4966)" >Recognized MOM: compact model versus extracted terminal charge</text>
<text fill="#222222"  xml:space="preserve" font-size="15.6" transform="translate(120, 152.165)" >298.15 K | 0 to 0.9 V in 1 ns | MINUS and BULK held at 0 V</text>
<text fill="#222222"  xml:space="preserve" font-size="15.6" transform="translate(120, 200.165)" >Integrate delivered PLUS current over 0.5 to 3 ns, then divide by 0.9 V.</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(120, 247.032)" >Native Spectre recipes are authoritative. This is their inspection mirror; no model payload is embedded.</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(582, 361.032)" >PLUS current</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(1272, 637.032)" >BULK current</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(120, 853.032)" >8 x 8 fingers; 280 nm width/spacing; M1 through M3; explicit substrate/shield terminal</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(120, 901.032)" >The source contains the factory CRTMOM model. PEX retains the actual recognized device and extracted network.</text>
<text fill="#222222"  xml:space="preserve" font-size="14.352" transform="translate(120, 949.032)" >This diagnostic measures correspondence; it does not qualify whole-generator heat or cryogenic capacitance.</text>
